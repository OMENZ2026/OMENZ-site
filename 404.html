    .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-weight:700; letter-spacing:2px; font-size:1.2rem; }
    .brand img { width:36px; filter: drop-shadow(0 0 8px var(--accent)); }
    nav a { color: var(--muted); text-decoration:none; margin-left:18px; font-size:.95rem; }
    nav a:hover { color: var(--text); }
    .hero { padding: 72px 0 40px; }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0 0 12px; letter-spacing: 2px; }
    .hero p.lead { font-size: 1.25rem; color: var(--muted); max-width: 720px; margin: 0 0 8px; }

    .btn { display:inline-block; padding:11px 18px; border-radius:6px; text-decoration:none; font-weight:700; margin: 0 10px 10px 0; }
    .btn.primary { background: var(--accent); color:#fff; }
    .btn.ghost { border:1px solid var(--line); color: var(--text); }
    section { padding: 44px 0; border-top: 1px solid var(--line); }
    section h2 { font-size: 1.6rem; margin: 0 0 6px; }
    section p.sub { color: var(--dim); margin: 0 0 22px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border:1px solid var(--line); border-radius: 10px; padding: 18px; display:flex; flex-direction:column; }
    .card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .card p { color: var(--muted); margin: 0 0 12px; font-size: .95rem; flex: 1; }
    .card .meta { color: var(--dim); font-size: .85rem; margin-bottom: 12px; }

<script>
  /* OMENZ first-party analytics: page views + outbound clicks. No cookies, no IP stored, honors Do Not Track. */
  (function () {
    if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
    var q = new URLSearchParams(location.search);
    function send(d) {
      try {
        d.p = location.pathname; d.r = document.referrer || ""; d.w = window.innerWidth;
        ["utm_source", "utm_medium", "utm_campaign", "utm_content"].forEach(function (k) { if (q.get(k)) d[k] = q.get(k); });
        var b = JSON.stringify(d);
        if (navigator.sendBeacon) navigator.sendBeacon("/api/t", new Blob([b], { type: "application/json" }));
        else fetch("/api/t", { method: "POST", body: b, keepalive: true, headers: { "Content-Type": "application/json" } });
      } catch (e) {}
    }
    send({ t: "404" });
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[data-dest]");
      if (a) send({ t: "click", dest: a.getAttribute("data-dest"), href: a.href });
    });
  })();
  </script>
